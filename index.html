<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শিক্ষার্থী তথ্য যাচাইকরণ পোর্টাল</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* ব্যাকগ্রাউন্ড গ্লো ইফেক্ট */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(99, 102, 241, 0.12);
            border-radius: 50%;
            top: 15%;
            left: 15%;
            filter: blur(80px);
            z-index: 0;
        }

        /* মেইন কন্টেইনার */
        .search-container {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 550px;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        h2 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 25px;
            background: linear-gradient(to right, #ffffff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: rgba(24, 34, 54, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            font-size: 17px;
            color: #fff;
            outline: none;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="text"]:focus {
            border-color: #6366f1;
            background: rgba(24, 34, 54, 0.9);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
        }

        /* লোডার */
        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
        }
        .custom-loader {
            width: 35px;
            height: 35px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loader-text {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 8px;
        }

        .error-message {
            color: #f87171;
            font-size: 15px;
            margin-top: 15px;
            display: none;
            animation: shake 0.3s ease;
        }

        /* প্রফেশনাল প্রোফাইল কার্ড */
        .profile-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 1;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
            display: none;
        }

        .profile-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card-body {
            display: flex;
            width: 100%;
            gap: 25px;
            align-items: center;
        }

        .avatar-zone img {
            width: 125px;
            height: 155px;
            object-fit: cover;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .info-zone {
            flex: 1;
        }

        .info-zone h3 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 12px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-row {
            display: flex;
            margin-bottom: 8px;
            font-size: 15px;
            color: #e2e8f0;
        }

        .info-label {
            color: #94a3b8;
            width: 90px;
            font-weight: 500;
        }

        .info-value {
            flex: 1;
            font-weight: 600;
        }

        /* ডায়নামিক ভেরিফাইড ব্যাজ */
        .verified-badge {
            width: 100%;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 10px;
            border-radius: 12px;
            color: #10b981;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            letter-spacing: 0.5px;
            animation: pulseBg 2s infinite;
        }

        .verified-badge i {
            font-size: 18px;
        }

        /* অ্যানিমেশনসমূহ */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        @keyframes pulseBg { 0%, 100% { background: rgba(16, 185, 129, 0.1); } 50% { background: rgba(16, 185, 129, 0.2); } }

        /* মোবাইল ফ্রেন্ডলি ডিজাইন */
        @media (max-width: 500px) {
            .card-body {
                flex-direction: column;
                text-align: center;
            }
            .info-row {
                flex-direction: column;
                gap: 2px;
            }
            .info-label {
                width: 100%;
                color: #818cf8;
            }
        }
    </style>
</head>
<body>

    <div class="search-container">
        <h2>শিক্ষার্থী তথ্য লাইভ অনুসন্ধান</h2>
        
        <div class="search-box-wrapper">
            <input type="text" id="searchInput" oninput="searchByRollOnly()" placeholder="শিক্ষার্থীর রোল নম্বরটি লিখুন..." autocomplete="off" disabled>
        </div>

        <div id="loaderArea" class="loader-wrapper">
            <div class="custom-loader"></div>
            <div class="loader-text">সার্ভার থেকে ডেটা সিঙ্ক হচ্ছে...</div>
        </div>
        
        <div id="errorMsg" class="error-message"></div>
    </div>

    <div id="profileCard" class="profile-card">
        <div class="card-body">
            <div class="avatar-zone">
                <img id="studentPhoto" src="" alt="Student Photo">
            </div>
            <div class="info-zone">
                <h3 id="studentName"></h3>
                <div class="info-row"><div class="info-label">রোল নম্বর:</div><div class="info-value" id="studentRoll"></div></div>
                <div class="info-row"><div class="info-label">ঠিকানা:</div><div class="info-value" id="studentAddress"></div></div>
                <div class="info-row"><div class="info-label">মোবাইল:</div><div class="info-value" id="studentMobile"></div></div>
            </div>
        </div>
        
        <div class="verified-badge">
            <i class="fa-solid fa-circle-check"></i> Verified Student
        </div>
    </div>

    <script>
        // আপনার গুগল অ্যাপস স্ক্রিপ্ট ওয়েব অ্যাপ ইউআরএল এখানে বসান
        var apiURL = "https://script.google.com/macros/s/AKfycbytO0KG-8bWkhsJOYNRnD5b0JINtYoE-kiZXybHrQBcW6JZbIZYwNlrdffqnpn2Qh_Ptg/exec"; 
        var studentData = [];

        // পেজ লোড হওয়ার সাথে সাথে ব্যাকগ্রাউন্ডে ডেটা লোড হবে
        window.onload = function() {
            fetch(apiURL)
                .then(response => response.json())
                .then(data => {
                    studentData = data;
                    document.getElementById('loaderArea').style.display = 'none';
                    document.getElementById('searchInput').disabled = false;
                    document.getElementById('searchInput').focus();
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('loaderArea').innerHTML = '<div style="color:#f87171; font-weight:600; margin-top:10px;">সার্ভার সংযোগ ব্যর্থ! পেজ রিফ্রেশ করুন।</div>';
                });
        };

        // মোবাইল নম্বর ফরম্যাটার ফাংশন (যেমন: 01919336660 -> 01919-336660)
        function formatMobileNumber(number) {
            var cleanNumber = String(number).trim().replace(/-/g, ''); // আগে থেকে হাইফেন থাকলে তা রিমুভ করে ক্লিন করবে
            if (cleanNumber.length === 11) {
                return cleanNumber.substring(0, 5) + '-' + cleanNumber.substring(5);
            }
            return cleanNumber; // নম্বর ১১ ডিজিটের না হলে মূল নম্বরই ব্যাক করবে
        }

        // শুধুমাত্র রোল নম্বর দ্বারা লাইভ সার্চ ফাংশন
        function searchByRollOnly() {
            var query = document.getElementById('searchInput').value.trim();
            var card = document.getElementById('profileCard');
            var errorMsg = document.getElementById('errorMsg');

            if (query === '') {
                hideProfileCard();
                errorMsg.style.display = 'none';
                return;
            }

            // শুধুমাত্র রোল নম্বরের সাথে নিখুঁত মিল (Exact Match) খোঁজা হচ্ছে
            var student = studentData.find(s => String(s.Roll).trim() === query);

            if (student) {
                errorMsg.style.display = 'none';
                
                document.getElementById('studentName').innerText = student.Name || 'জানা যায়নি';
                document.getElementById('studentRoll').innerText = student.Roll;
                document.getElementById('studentAddress').innerText = student.Address || 'জানা যায়নি';
                
                // মোবাইল নম্বর ফরম্যাট প্রয়োগ
                document.getElementById('studentMobile').innerText = formatMobileNumber(student.Mobile);

                // ড্রাইভ ইমেজ স্মার্ট ফিল্টার
                var rawUrl = student.Photo_URL || '';
                if (rawUrl.includes('drive.google.com')) {
                    var fileId = rawUrl.split('/d/')[1]?.split('/')[0];
                    if (fileId) {
                        rawUrl = 'https://lh3.googleusercontent.com/d/' + fileId;
                    }
                }
                document.getElementById('studentPhoto').src = rawUrl || 'https://via.placeholder.com/150';

                card.style.display = 'flex';
                setTimeout(() => { card.classList.add('active'); }, 50);
            } else {
                hideProfileCard();
                errorMsg.innerText = 'দুঃখিত, এই রোল নম্বরের কোনো তথ্য পাওয়া যায়নি!';
                errorMsg.style.display = 'block';
            }
        }

        function hideProfileCard() {
            var card = document.getElementById('profileCard');
            card.classList.remove('active');
            setTimeout(() => { card.style.display = 'none'; }, 400);
        }
    </script>
</body>
</html>
