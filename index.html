<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Verification Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
footer{
margin-top:100px;
text-align:center;
font-size:12px;
color:#666;
padding:15px;
border-top:1px solid #ddd;
}
body{
font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
background-attachment:fixed;
margin:0;
color:#ffffff;
}
.wrap{max-width:1000px;margin:auto;padding:20px}
h1{text-align:center;color:#ffffff}
.box{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
input,button{
padding:12px;
border-radius:14px;
border:none;
box-shadow:0 6px 18px rgba(0,0,0,.25);
}

input{
background:#0f172a;
color:#fff;
border:1px solid #3b82f6;
}

input::placeholder{
color:#cbd5e1;
}
button{cursor:pointer;background:linear-gradient(45deg,#2563eb,#06b6d4);color:#fff;font-weight:700}
#clearBtn{display:none}
#loader{display:none;text-align:center;padding:20px}
.spin{width:60px;height:60px;border:8px solid #ddd;border-top:8px solid #2563eb;border-radius:50%;margin:auto;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.card{
margin-top:20px;
background:rgba(15,23,42,.65);
backdrop-filter:blur(15px);
display:flex;
gap:20px;
padding:20px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.4);
flex-wrap:wrap;
border:1px solid rgba(255,255,255,.15);
}
.left{text-align:center;width:220px}
.left img{width:180px;height:220px;object-fit:cover;border-radius:12px}
.name{font-size:40px;font-weight:700;color:#ffffff}
.seal{
width:140px;
height:140px;
border:6px solid #16a34a;
border-radius:50%;
margin-top:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:700;
color:#16a34a;
animation:seal 2s infinite;
box-shadow:0 0 15px rgba(22,163,74,.4);
}

@keyframes seal{

0%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

100%{
transform:scale(1);
}

}
.nf{background:#0cff00}
.actions{margin-top:15px}
.actions button{margin-right:8px}

.bottomArea{
    display:flex;
    align-items:center;
    gap:20px;
    margin-top:20px;
    flex-wrap:wrap;
}

#qr{
    width:110px;
    height:110px;
    padding:10px;
    border:2px solid #2563eb;
    border-radius:8px;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.seal{
width:140px;
height:140px;
border:6px solid #16a34a;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:700;
color:#ffffff;
animation:seal 2s infinite;
box-shadow:0 0 15px rgba(22,163,74,.4);
}

.badge{
display:inline-block;
padding:12px 25px;
border-radius:30px;
font-weight:700;
color:#ffffff;
animation:flash 1.5s infinite;
}

.ok{
background:#16a34a;
}

.nf{
background:#dc2626;
}

@keyframes flash{

0%{
transform:scale(1);
opacity:1;
}

50%{
transform:scale(1.05);
opacity:.8;
}

100%{
transform:scale(1);
opacity:1;
}

}

.wrap{
max-width:1000px;
margin:auto;
padding:20px;
animation:pageOpen 1.2s ease;
}

@keyframes pageOpen{

0%{
opacity:0;
transform:translateY(40px) scale(.95);
}

100%{
opacity:1;
transform:translateY(0) scale(1);
}

}

</style>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>
<div class="wrap">
<h1><i class="fa-solid fa-user-graduate"></i> Student Verification Portal</h1>
<div class="box">
<input id="roll" placeholder="🎫 Roll Number">
<input id="reg" placeholder="📝 Registration Number">
<button onclick="searchData()"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
<button id="clearBtn" onclick="clearData()"><i class="fa-solid fa-trash"></i> Clear</button>
</div>
<div id="loader"><div class="spin"></div><p>Searching...</p></div>
<div id="result"></div>
<footer>

@ 2026 SMART COMPUTER - All Rights Reserved

</footer>
</div>
<script>
const API ="https://script.google.com/macros/s/AKfycbwG2ll2cJfpz7QIiXN2sMKOrUTj12kY8i_A_cySXEqNAfIfj846IYNOmBu1ra0OE6ht/exec";

async function searchData(){

loader.style.display="block";

let url =
API +
"?roll=" +
roll.value +
"&reg=" +
reg.value;

let res =
await fetch(url);

let json =
await res.json();

loader.style.display="none";

if(json.status){

showData(json.data);

clearBtn.style.display="inline-block";

}else{

result.innerHTML=
`
<div style="text-align:center;margin-top:30px;">
<div class="badge nf">
❌ NOT FOUND
</div>
</div>
`;

clearBtn.style.display="inline-block";

}

}
function showData(d){
result.innerHTML=`
<div id="printArea" class="card">
<div class="left">
<img src="${d.Photo}">
</div>
<div>
<div class="name">${d["Student Name"]}</div>
<p><b>Father's Name:</b> ${d["Father Name"]}</p>
<p><b>Mother's Name:</b> ${d["Mother Name"]}</p>
<p>
<b>Date of Birth:</b>
${new Date(d.DOB).toLocaleDateString(
'en-GB',
{
day:'2-digit',
month:'short',
year:'numeric'
}
).replace(/ /g,'-')}
</p>
<p><b>Subject:</b> ${d.Subject}</p>
<p><b>Roll:</b> ${d.Roll}</p>
<p><b>Registration:</b> ${d.Registration}</p>
<div class="bottomArea">

<div id="qr"></div>

<div class="seal">
✔ Verified
</div>

</div>
</div>
</div>`;
new QRCode(
document.getElementById("qr"),
{
text:
"Student Name : " + d["Student Name"] +
"\nFather Name : " + d["Father Name"] +
"\nMother Name : " + d["Mother Name"] +
"\nDate of Birth : " + d.DOB +
"\nSubject : " + d.Subject +
"\nRoll : " + d.Roll +
"\nRegistration : " + d.Registration,

width:100,
height:100

}
);
}

function clearData(){
result.innerHTML="";
clearBtn.style.display="none";
roll.value="";
reg.value="";
}

</script>
</body>
</html>
